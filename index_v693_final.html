<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>百家樂 V6.93</title>
<style>body{margin:0;background:#0d1117;color:#f0f3f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.w{max-width:720px;margin:auto;padding:10px}.c{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:13px;margin:9px 0}h1{text-align:center;font-size:23px}.sub,.m{color:#8b949e;font-size:13px;line-height:1.6;text-align:center}.sig{text-align:center;font-size:52px;font-weight:900}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.x{background:#0d1117;border-radius:12px;padding:9px;text-align:center}.x small{display:block;color:#8b949e}.x b{font-size:18px}button{border:0;border-radius:16px;color:white;font-weight:900;min-height:92px;font-size:30px}.B{background:#ef5350}.P{background:#2f81f7}.T{background:#3fb950}.sticky{position:sticky;bottom:8px}.hist{display:flex;flex-wrap:wrap;gap:5px}.d{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.d.B{background:#ef5350}.d.P{background:#2f81f7}.d.T{background:#3fb950}</style></head><body><div class="w">
<h1>百家樂 V6.93</h1><div class="sub">從你開始輸入算起｜前10個非和局觀察｜最近12個非和局滾動分析｜2局內停舊盤｜-3改冷卻，不必換靴</div>
<div class="c"><div id="sig" class="sig">等待資料</div><div id="why" class="m">至少累積10個非和局</div><div class="g"><div class="x"><small>節奏</small><b id="kind">—</b></div><div class="x"><small>牌型吻合</small><b id="fit">—</b></div><div class="x"><small>局數</small><b id="rounds">0</b></div></div></div>
<div class="c sticky"><div class="g"><button class="B" onclick="go('B')">莊</button><button class="P" onclick="go('P')">閒</button><button class="T" onclick="go('T')">和</button></div></div>
<div class="c"><div class="g"><div class="x"><small>有效</small><b id="n">0</b></div><div class="x"><small>命中</small><b id="hit">0</b></div><div class="x"><small>命中率</small><b id="rate">—</b></div></div><div class="g" style="margin-top:8px"><div class="x"><small>失敗</small><b id="miss">0</b></div><div class="x"><small>Push</small><b id="push">0</b></div><div class="x"><small>跳過</small><b id="skip">0</b></div></div></div>
<div class="c"><div class="g"><div class="x"><small>本次累積損益</small><b id="pl">0.00</b></div><div class="x"><small>風控狀態</small><b id="risk">正常</b></div><div class="x"><small>冷卻剩餘</small><b id="cool">0</b></div></div><div class="m" style="margin-top:10px">莊勝 +0.95、閒勝 +1、輸 -1、和局 0。每個風控週期到 -3 單位時，改為冷卻5個非和局；冷卻結束後仍要重新符合牌型才恢復訊號，不要求換靴。</div></div>
<div class="c"><div id="hist" class="hist"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button style="min-height:50px;font-size:16px;background:#30363d" onclick="undoLast()">按錯了｜撤回上一局</button><button style="min-height:50px;font-size:16px;background:#7d2932" onclick="resetStats()">重設命中率＋損益</button></div><button style="margin-top:8px;width:100%;min-height:50px;font-size:16px;background:#30363d" onclick="clearRoad()">清空目前牌路（保留命中率）</button><div class="m" style="margin-top:10px">不分新靴或中途進場。你從看到的第一局開始輸入即可；前面看不到的資料不假設、不補猜。舊節奏失去支持2次就先跳過，新節奏要再確認才恢復出訊號。</div></div>
</div><script>
const K='baccarat_v69';
let s=JSON.parse(localStorage.getItem(K)||'null')||{h:[],r:[],last:null,skip:0,sessionPL:0,cyclePL:0,cooldown:0,cooldownLevel:0,regime:{active:null,breakCount:0},undo:null};
for(const [k,v] of Object.entries({h:[],r:[],last:null,skip:0,sessionPL:0,cyclePL:0,cooldown:0,cooldownLevel:0,regime:{active:null,breakCount:0},undo:null}))if(s[k]===undefined)s[k]=v;
const pats={'單跳':[1],'雙跳':[2],'三段交替':[3],'1-2節奏':[1,2],'2-1節奏':[2,1],'1-3節奏':[1,3],'3-1節奏':[3,1],'2-2節奏':[2,2],'2-3節奏':[2,3],'3-2節奏':[3,2],'3-3節奏':[3,3]};
function template(lens,start){let a=[],side=start,i=0;while(a.length<120){for(let k=0;k<lens[i%lens.length];k++)a.push(side);side=side==='B'?'P':'B';i++}return a}
function longModel(h){if(h.length<10)return{p:'S',k:'觀察中',sc:0,r3:0};let r=h.slice(-12),best=null;for(const [name,lens] of Object.entries(pats))for(const start of ['B','P']){let a=template(lens,start),period=lens.reduce((x,y)=>x+y,0)*2;for(let ph=0;ph<period;ph++){let t=a.slice(ph,ph+r.length+1),num=0,den=0;for(let j=0;j<r.length;j++){let w=j>=r.length-3?2.8:1;den+=w;if(r[j]===t[j])num+=w}let sc=num/den,r3=0;for(let j=0;j<3;j++)if(r[r.length-3+j]===t[r.length-3+j])r3++;r3/=3;let z={adj:sc+.08*r3,sc,r3,p:t[r.length],k:name};if(!best||z.adj>best.adj)best=z}}return best}
function shortNew(h){if(h.length<5)return null;let q=h.slice(-7),best=null;for(const [name,lens] of Object.entries(pats))for(const start of ['B','P']){let a=template(lens,start),period=lens.reduce((x,y)=>x+y,0)*2;for(let ph=0;ph<period;ph++){let t=a.slice(ph,ph+q.length+1),weights=[1,1,2,3,5,7,9].slice(-q.length),num=0,den=0;for(let j=0;j<q.length;j++){den+=weights[j];if(q[j]===t[j])num+=weights[j]}let sc=num/den,last4=true;for(let j=0;j<4;j++)if(q[q.length-4+j]!==t[q.length-4+j])last4=false;let z={sc,last4,p:t[q.length],k:'新盤：'+name};if(!best||z.sc>best.sc)best=z}}return best&&best.sc>=.86&&best.last4?best:null}

function dragonPriority(h){
  if(h.length<4)return null;
  let a=h[h.length-1], b=h[h.length-2], c=h[h.length-3], d=h[h.length-4];
  if(a===b && b===c && c===d){
    return {p:a,k:(a==='B'?'莊龍':'閒龍')+'／4連優先',sc:1,dragon:true};
  }
  return null;
}
function predict(h){
 let dg=dragonPriority(h);
 if(dg)return dg;if(!s.regime)s.regime={active:null,breakCount:0};if(h.length<10)return{p:'S',k:'觀察中',sc:0};let lm=longModel(h),active=s.regime.active,bc=s.regime.breakCount||0;if(!active){if(lm.sc>=.76&&lm.r3>=2/3){s.regime.active=lm.k;s.regime.breakCount=0;return{p:lm.p,k:lm.k,sc:lm.sc}}let np=shortNew(h);if(np){s.regime.active=np.k.replace('新盤：','');s.regime.breakCount=0;return np}return{p:'S',k:'混亂／觀察',sc:lm.sc}}let supported=lm.k===active&&lm.sc>=.72&&lm.r3>=2/3;if(supported){s.regime.breakCount=0;return{p:lm.p,k:active,sc:lm.sc}}bc++;s.regime.breakCount=bc;if(bc>=2)s.regime.active=null;let np=shortNew(h);if(np&&bc>=2){s.regime.active=np.k.replace('新盤：','');s.regime.breakCount=0;return np}return{p:'S',k:'變盤觀察 '+Math.min(bc,3)+'/3',sc:lm.sc}}
function nt(){return s.h.filter(x=>x!=='T')}function save(){localStorage.setItem(K,JSON.stringify(s))}function snap(){const {undo,...rest}=s;return JSON.parse(JSON.stringify(rest))}
function go(a){s.undo=snap();let forced=s.cooldown>0;let prev=s.last;if(forced){s.skip++}else if(prev&&prev.p!=='S'){let g=a==='T'?'push':a===prev.p?'hit':'miss';s.r.push({g,pick:prev.p});if(g==='hit'){let d=prev.p==='B'?.95:1;s.sessionPL+=d;s.cyclePL+=d}else if(g==='miss'){s.sessionPL-=1;s.cyclePL-=1}if(s.cyclePL<=-3){s.cooldown=5;s.cooldownLevel++;s.cyclePL=0;s.regime={active:null,breakCount:0}}}else if(prev)s.skip++;s.h.push(a);if(a!=='T'&&forced&&s.cooldown>0)s.cooldown--;let p=predict(nt());s.last=s.cooldown>0?{p:'S',k:'冷卻觀察',sc:p.sc}:p;save();render()}
function undoLast(){if(!s.undo){alert('目前沒有可撤回的上一局。');return}s=s.undo;s.undo=null;save();render()}
function resetStats(){if(!confirm('確定重設命中率與損益？命中、失敗、Push、跳過、累積損益與冷卻狀態都會歸零，但目前牌路保留。'))return;s.r=[];s.skip=0;s.sessionPL=0;s.cyclePL=0;s.cooldown=0;s.cooldownLevel=0;s.undo=null;save();render()}
function clearRoad(){if(!confirm('清空目前牌路？命中率與本次累積損益會保留。'))return;s.h=[];s.last=null;s.cyclePL=0;s.cooldown=0;s.cooldownLevel=0;s.regime={active:null,breakCount:0};s.undo=null;save();render()}
function render(){rounds.textContent=s.h.length;let L=s.last;if(!L){sig.textContent='等待資料';kind.textContent='—';fit.textContent='—';why.textContent='至少累積10個非和局'}else{sig.textContent=L.p==='B'?'莊':L.p==='P'?'閒':'跳過';sig.style.color=L.p==='B'?'#ff6b63':L.p==='P'?'#58a6ff':'#f2cc60';kind.textContent=L.k;fit.textContent=(L.sc*100).toFixed(0)+'%';why.textContent=s.cooldown>0?'風控冷卻中，繼續記牌但不出訊號。':L.p==='S'?'節奏不夠穩定或正在轉盤，跳過。':'依最近12局節奏判斷；最近3局權重最高。若最近4個非和局同邊，龍優先蓋過1-2／1-3反向模板。'}hist.innerHTML='';s.h.slice(-60).forEach(x=>{let d=document.createElement('div');d.className='d '+x;d.textContent=x==='B'?'莊':x==='P'?'閒':'和';hist.appendChild(d)});let rr=s.r.filter(x=>x.g!=='push'),hh=rr.filter(x=>x.g==='hit').length,mm=rr.filter(x=>x.g==='miss').length,pp=s.r.filter(x=>x.g==='push').length;n.textContent=rr.length;hit.textContent=hh;miss.textContent=mm;push.textContent=pp;skip.textContent=s.skip;rate.textContent=rr.length?(hh/rr.length*100).toFixed(1)+'%':'—';pl.textContent=(s.sessionPL||0).toFixed(2);risk.textContent=s.cooldown>0?'冷卻中':'正常';cool.textContent=s.cooldown||0}render();
</script></body></html>
